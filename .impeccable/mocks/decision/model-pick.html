<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111614;font-family:'Public Sans',sans-serif}
.status{height:44px}
.bar{display:flex;justify-content:space-between;padding:8px 20px 12px;font-size:15px;font-weight:600;border-bottom:1px solid #D9E4DE}
.hd{padding:20px}
.hd p{font-size:13px;color:#4A5651}
.hd h2{font-size:56px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hd h2 small{font-size:22px;font-weight:600}
.fig{margin:0 20px;height:250px;border:1px solid #D9E4DE;position:relative}
.goat{position:absolute;left:70px;top:80px;width:220px;height:90px;border:2px solid #111614;border-radius:40px 60px 30px 30px}
.dim{position:absolute;border-color:#0F5C45;border-style:solid;border-width:0}
.dl{left:70px;top:190px;width:220px;border-top-width:1px}
.dh{left:310px;top:80px;height:90px;border-left-width:1px}
.lab{position:absolute;font-size:12px;color:#0F5C45;font-weight:600}
.list{margin:20px}
.li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #D9E4DE;font-size:16px}
.li b{font-variant-numeric:tabular-nums}
.btns{position:absolute;bottom:34px;left:20px;right:20px;display:flex;gap:12px}
.btns div{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-weight:600}
.p{background:#0F5C45;color:#fff}.s{border:1px solid #111614}
</style></head><body>
<div class="status"></div>
<div class="bar"><span>Bituin · T-014</span><span>Adult</span></div>
<div class="hd"><p>Estimated Weight</p><h2>32.4 <small>kg</small></h2></div>
<div class="fig"><div class="goat"></div><div class="dim dl"></div><div class="lab" style="left:140px;top:198px">Body length 68.2 cm</div><div class="dim dh"></div><div class="lab" style="left:316px;top:110px">Chest<br>height</div><div class="lab" style="left:20px;top:16px">Side view · fig. 1</div></div>
<div class="list">
<div class="li"><span>Body Length</span><b>68.2 cm</b></div>
<div class="li"><span>Chest Height</span><b>31.5 cm</b></div>
<div class="li"><span>Chest Width</span><b>19.8 cm</b></div>
<div class="li"><span>Heart Girth</span><b>72.6 cm</b></div>
</div>
<div class="btns"><div class="s">Home</div><div class="p">Save Goat</div></div>
</body></html>
