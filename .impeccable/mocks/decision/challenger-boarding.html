<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F7F7F5;color:#141414;font-family:'Public Sans',sans-serif}
.status{height:44px}
.bar{padding:8px 20px 16px;display:flex;justify-content:space-between;align-items:baseline}
.bar h1{font-size:22px;font-weight:700}.bar span{font-size:13px;color:#555}
.board{margin:0 12px;background:#141414;color:#F7F7F5;border-radius:12px;padding:6px 0}
.th,.tr{display:grid;grid-template-columns:64px 1fr 70px 64px;padding:10px 14px;font-variant-numeric:tabular-nums}
.th{font-size:11px;color:#9A9A9A;letter-spacing:.06em}
.tr{font-size:16px;border-top:1px solid #2B2B2B}
.tr.lit{background:#E0A100;color:#141414;font-weight:600}
.slip{margin:24px 12px;background:#fff;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #DDD}
.slip div{padding:14px;border-right:1px dashed #CCC;border-bottom:1px dashed #CCC}
.slip small{display:block;font-size:11px;color:#777}
.slip b{font-size:18px;font-variant-numeric:tabular-nums}
.fab{position:absolute;bottom:110px;right:20px;background:#141414;color:#fff;border-radius:16px;padding:18px 22px;font-weight:600}
.nav{position:absolute;bottom:0;width:390px;height:80px;background:#EDEDEA;display:flex;justify-content:space-around;padding-top:16px;font-size:12px}
</style></head><body>
<div class="status"></div>
<div class="bar"><h1>Sale board</h1><span>Offline · 12 goats</span></div>
<div class="board">
<div class="th"><span>TAG</span><span>GOAT</span><span>KG</span><span>STATUS</span></div>
<div class="tr lit"><span>T-014</span><span>Bituin</span><span>32.4</span><span>Ready</span></div>
<div class="tr"><span>T-008</span><span>Dalisay</span><span>28.9</span><span>6 d</span></div>
<div class="tr"><span>T-021</span><span>Mayumi</span><span>21.8</span><span>31 d</span></div>
<div class="tr"><span>T-030</span><span>Kidlat</span><span>11.2</span><span>74 d</span></div>
<div class="tr"><span>T-017</span><span>Ligaya</span><span>19.6</span><span>40 d</span></div>
</div>
<div class="slip"><div><small>LAST WEIGHING</small><b>T-030</b></div><div><small>ESTIMATED WEIGHT</small><b>11.2 kg</b></div><div><small>STAGE</small><b>Young</b></div><div><small>HEART GIRTH</small><b>48.1 cm</b></div></div>
<div class="fab">+ New weighing</div>
<div class="nav"><span>Board</span><span>Goats</span><span>Co-op</span><span>Settings</span></div>
</body></html>
