<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1B1B1B;font-family:Roboto,sans-serif}
.status{height:44px;background:#2E7D32}
.bar{background:#2E7D32;color:#fff;padding:12px 16px 18px;font-size:22px}
.card{margin:12px 16px;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:#C8E6C9}
.card b{display:block;font-size:16px}.card span{font-size:13px;color:#666}
.card i{margin-left:auto;font-style:normal;font-weight:600}
.fab{position:absolute;bottom:100px;right:16px;width:56px;height:56px;border-radius:16px;background:#2E7D32;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;bottom:0;width:390px;height:80px;border-top:1px solid #eee;display:flex;justify-content:space-around;padding-top:16px;font-size:12px}
</style></head><body>
<div class="status"></div><div class="bar">My Goats</div>
<div class="card"><div class="av"></div><div><b>Bituin</b><span>Adult</span></div><i>32.4 kg</i></div>
<div class="card"><div class="av"></div><div><b>Mayumi</b><span>Grower</span></div><i>21.8 kg</i></div>
<div class="card"><div class="av"></div><div><b>Kidlat</b><span>Young</span></div><i>11.2 kg</i></div>
<div class="card"><div class="av"></div><div><b>Dalisay</b><span>Adult</span></div><i>28.9 kg</i></div>
<div class="fab">+</div>
<div class="nav"><span>Home</span><span>Goats</span><span>History</span><span>Settings</span></div>
</body></html>
